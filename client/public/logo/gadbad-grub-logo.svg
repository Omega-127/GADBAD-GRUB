<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" fill="none">
  <defs>
    <linearGradient id="nitroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF3366" />
      <stop offset="50%" stop-color="#FF9900" />
      <stop offset="100%" stop-color="#FFD000" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="100%" stop-color="#7928CA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Speed Lines -->
  <path d="M10 30 L60 30" stroke="#00F0FF" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  <path d="M5 50 L55 50" stroke="#FFD000" stroke-width="4" stroke-linecap="round"/>
  <path d="M15 70 L65 70" stroke="#FF3366" stroke-width="3" stroke-linecap="round" opacity="0.8"/>

  <!-- Delivery Racing Kart Icon -->
  <g transform="translate(68, 15) scale(0.7)">
    <circle cx="45" cy="50" r="40" fill="#141926" stroke="url(#neonCyan)" stroke-width="3"/>
    <!-- Burger Racer -->
    <path d="M25 40 Q45 20 65 40 Z" fill="#FFB300"/>
    <rect x="23" y="42" width="44" height="6" rx="3" fill="#00E676"/>
    <rect x="25" y="50" width="40" height="8" rx="4" fill="#8D4004"/>
    <path d="M25 60 Q45 68 65 60 Z" fill="#FFB300"/>
    <!-- Wheels -->
    <circle cx="28" cy="74" r="10" fill="#0F172A" stroke="#00F0FF" stroke-width="3"/>
    <circle cx="62" cy="74" r="10" fill="#0F172A" stroke="#FF3366" stroke-width="3"/>
    <!-- Speed Flame -->
    <path d="M18 55 Q5 50 12 40 Q2 35 15 28" stroke="url(#nitroGrad)" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Typography -->
  <text x="145" y="48" font-family="'Orbitron', 'Rajdhani', sans-serif" font-weight="900" font-size="34" fill="#FFFFFF" letter-spacing="2">
    GADBAD
  </text>
  <text x="290" y="48" font-family="'Orbitron', 'Rajdhani', sans-serif" font-weight="900" font-size="34" fill="url(#nitroGrad)" letter-spacing="2">
    GRUB
  </text>
  
  <rect x="146" y="58" width="220" height="3" fill="url(#neonCyan)" rx="1.5" />
  
  <text x="147" y="78" font-family="'Outfit', sans-serif" font-weight="600" font-size="12" fill="#00F0FF" letter-spacing="4">
    SPEED RACING FOOD
  </text>
</svg>
